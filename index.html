<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LiKo Navigation Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7c86'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#0e7c86',
                    surface: '#f6fafe',
                    'surface-container': '#f0f4f8',
                    'on-surface': '#1a1c1e',
                    'on-surface-variant': '#44474e',
                    outline: '#74777f',
                },
                borderRadius: {
                    'DEFAULT': '0.5rem',
                    'lg': '0.75rem',
                    'xl': '1rem',
                    '2xl': '1.5rem',
                    '3xl': '2rem',
                },
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                }
            }
        }
    }
</script>
<style>
    body {
        background-color: #f6fafe;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
    }

    .main-content {
        flex: 1;
    }

    .bg-gradient-mesh {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
        background: linear-gradient(125deg, #f6fafe 0%, #e0f2f1 40%, #f0f4f8 70%, #ffffff 100%);
        background-size: 400% 400%;
        animation: mesh-animation 15s ease infinite;
    }

    @keyframes mesh-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .ambient-shape {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        z-index: -1;
        opacity: 0.35;
        animation: float 20s infinite alternate;
    }

    @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(80px, 40px) scale(1.15); }
    }

    .card-shadow {
        box-shadow: 0 2px 12px -2px rgba(0, 0, 0, 0.05), 0 1px 6px -2px rgba(0, 0, 0, 0.03);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-shadow:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px -8px rgba(14, 124, 134, 0.15);
    }

    .glass-tag {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .visit-btn {
        background: #ffffff;
        border: 1px solid #e0e4e8;
        transition: all 0.3s ease;
    }

    .visit-btn:hover {
        background: #0e7c86;
        color: white;
        border-color: #0e7c86;
        box-shadow: 0 8px 16px -4px rgba(14, 124, 134, 0.3);
    }

    .preview-img {
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .preview-img.loaded {
        opacity: 1;
    }
</style>
</head>
<body>
<div class="main-content p-4 md:p-6 lg:p-8">
<div class="bg-gradient-mesh"></div>
<div class="ambient-shape w-72 h-72 bg-primary/10 top-[-8%] left-[-8%]"></div>
<div class="ambient-shape w-60 h-60 bg-blue-200/20 bottom-[-5%] right-[-5%]" style="animation: float 25s infinite alternate-reverse;"></div>

<main class="max-w-5xl mx-auto">
    <header class="text-center mb-6 lg:mb-10">
        <h1 class="text-4xl md:text-6xl font-black text-primary tracking-tighter mb-2 opacity-90">LiKo</h1>
        <p class="text-on-surface-variant font-medium tracking-widest uppercase text-xs">Personal Navigation Sanctuary</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5">

        <div class="bg-white rounded-2xl overflow-hidden card-shadow flex flex-col">
            <div class="relative h-36 md:h-40 overflow-hidden bg-gradient-to-br from-rose-200 via-pink-100 to-red-200">
                <img
                  class="preview-img absolute inset-0 w-full h-full object-cover z-10"
                  style="object-position: 50% 50%;"
                  src="https://image.thum.io/get/width/1024/crop/960/https://couple.li-ko.cn/"
                  onerror="this.remove()"
                  onload="this.classList.add('loaded')"
                  loading="eager"
                  alt="LiKoCouple Preview"/>
                <div class="absolute inset-0 flex items-center justify-center z-0">
                    <div class="text-center opacity-70">
                        <svg class="w-10 h-10 mx-auto text-rose-300" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                        <p class="mt-1 text-rose-400 text-xs font-medium">LiKoCouple</p>
                    </div>
                </div>
                <div class="absolute top-3 left-3 z-20">
                    <div class="w-8 h-8 rounded-lg glass-tag flex items-center justify-center shadow-sm">
                        <svg class="w-4 h-4 text-primary" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="p-5 md:p-6 flex flex-col flex-grow">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg md:text-xl font-bold text-on-surface">LiKoCouple</h3>
                    <span class="px-2.5 py-0.5 bg-rose-50 text-rose-600 text-[9px] font-bold uppercase tracking-wider rounded-full border border-rose-100">Love</span>
                </div>
                <p class="text-on-surface-variant text-xs leading-relaxed mb-5 flex-grow">
                    属于我们的数字小窝，记录甜蜜时光与温暖点滴。
                </p>
                <a class="visit-btn w-full py-3 text-center rounded-xl font-bold text-xs" href="https://couple.li-ko.cn/#/" target="_blank">立即访问</a>
            </div>
        </div>

    </div>
</main>

</div>

<footer class="text-center pt-6 pb-1">
    <div class="inline-flex flex-wrap justify-center items-center gap-x-4 gap-y-1 text-[11px] text-on-surface-variant/50">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" class="hover:text-on-surface-variant transition-colors">苏ICP备2026034241号-1</a>
        <span class="opacity-30 select-none">|</span>
        <a href="http://www.beian.gov.cn/portal/registerSystemInfo" target="_blank" rel="noopener" class="inline-flex items-center gap-1 hover:text-on-surface-variant transition-colors">
            <img src="gongan.png" class="w-3.5 h-3.5 inline-block align-middle" alt=""/> 苏公网安备 xxxxxx号
        </a>
    </div>
</footer>
</body>
</html>
